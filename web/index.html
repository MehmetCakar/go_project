<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="/assets/app.css">
  <title>Cakarokko • Ürünler</title>
</head>
<body>
  <nav class="nav">
    <a class="active" href="/">Ürünler</a>
    <a href="/cart">Sepet</a>
    <a class="right" href="/auth?logout=1">Çıkış</a>
  </nav>

  <main class="container">
    <h1>Ürünler</h1>
    <div id="msg" class="msg"></div>
    <div id="list" class="grid"></div>
  </main>

  <script>
  // Küçük yardımcılar
  async function api(path, opts = {}) {
    const res = await fetch(path, {
      method: opts.method || 'GET',
      headers: Object.assign(
        { 'Content-Type': 'application/json' },
        opts.headers || {}
      ),
      body: opts.body ? JSON.stringify(opts.body) : null,
      credentials: 'include', // cookie ile auth
    });

    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = text; }

    if (!res.ok) {
      const err = (data && data.error) || ('HTTP ' + res.status);
      throw new Error(err);
    }
    return data;
  }

  function showMsg(t, ok = true) {
    const el = document.getElementById('msg');
    if (!el) return;
    el.textContent = t;
    el.style.color = ok ? '#16a34a' : '#ef4444';
  }

  function pick(v, ...alts) {
    for (const k of [v, ...alts]) {
      if (k !== undefined && k !== null) return k;
    }
    return undefined;
  }

  async function loadProducts() {
    try {
      const data = await api('/api/products');
      const list = document.getElementById('list');
      if (!list) return;
      if (!Array.isArray(data)) throw new Error('Beklenmeyen yanıt');

      const hasExt = (s) => /\.(png|jpe?g|webp|gif|svg)$/i.test(s);

      list.innerHTML = data.map(p => {
        const id   = pick(p.ID, p.id);
        const name = pick(p.Name, p.name) || 'Ürün';

        let raw = pick(p.ImageURL, p.image_url, p.imageUrl, p.image, p.img);
        raw = (raw ?? '').toString().trim();

        let img;
        if (raw && /^https?:\/\//.test(raw)) {
          img = hasExt(raw) ? raw : '/assets/img/placeholder.png';
        } else if (raw && raw.startsWith('/assets/')) {
          img = hasExt(raw) ? raw : '/assets/img/placeholder.png';
        } else if (raw) {
          const fname = raw.replace(/^\/+/, '').replace(/^assets\/img\/?/, '');
          img = hasExt(fname) ? '/assets/img/' + fname : '/assets/img/placeholder.png';
        } else {
          img = '/assets/img/placeholder.png';
        }

        const cents = pick(p.PriceCents, p.price_cents, p.priceCents, 0) || 0;
        const price = (Number(cents) / 100).toFixed(2);

        return `
          <div class="card">
            <img src="${img}" alt="${name}" loading="lazy"
                 onerror="this.onerror=null;this.src='/assets/img/placeholder.png'">
            <div class="b">
              <div class="t">${name}</div>
              <div class="price">${price} ₺</div>
              <button onclick="addToCart(${id})">Sepete Ekle</button>
            </div>
          </div>
        `;
      }).join('');

    } catch (e) {
      showMsg('Ürünler yüklenemedi: ' + e.message, false);
    }
  }

  async function addToCart(id) {
    try {
      await api('/api/cart/add', {
        method: 'POST',
        body: { product_id: id, qty: 1 },
      });
      showMsg('Sepete eklendi', true);
    } catch (e) {
      showMsg('Giriş yapmanız gerekebilir: ' + e.message, false);
    }
  }

  // Sayfa yüklenince ürünleri getir
  document.addEventListener('DOMContentLoaded', loadProducts);
  </script>
</body>
</html>
